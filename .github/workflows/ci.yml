name: Fleed CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleed-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare Worker types
        run: pnpm exec wrangler types

      - name: Type-check
        run: pnpm typecheck

      - name: Run regression tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install standalone MCP tool dependencies
        run: pnpm --dir tools/fleed-mcp install --no-frozen-lockfile

      - name: Type-check standalone MCP server
        run: pnpm --dir tools/fleed-mcp typecheck

      - name: Exercise MCP stdio protocol
        run: pnpm --dir tools/fleed-mcp test
