name: Fleed Live Site Health

on:
  schedule:
    - cron: '17 08 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  health:
    name: Verify public homepage
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check HTTPS and Fleed branding
        run: node scripts/check-live-site.mjs
      - name: Diagnose DNS and origin hosts (read-only)
        run: node scripts/diagnose-hosting.mjs
